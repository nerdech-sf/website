name: Deploy website

on:
  push:
    branches:
      - xronos
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: nerdech.co.jp/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/node_modules/**
            **/dist/**
            **/package.json
            **/package-lock.json
            **/Vite.config
