<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="nerdech へのお問い合わせ — プロジェクトのご相談はこちらから">
    <meta name="theme-color" content="#0a0a0a">
    <!-- OGP -->
    <meta property="og:type"        content="website">
    <meta property="og:url"         content="https://nerdech.com/contact">
    <meta property="og:title"       content="contact | nerdech">
    <meta property="og:description" content="プロジェクトのご相談はこちらから">
    <meta property="og:image"       content="https://nerdech.com/og-image.png">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="contact | nerdech">
    <meta name="twitter:description" content="プロジェクトのご相談はこちらから">
    <meta name="twitter:image"       content="https://nerdech.com/og-image.png">
    <title>contact | nerdech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">

    <div class="contact-split">

        <!-- ── 左パネル ── -->
        <aside class="contact-split__left">

            <div class="cs-top">
                <a href="index.html" class="cs-back">← nerdech</a>
            </div>

            <div class="cs-main">
                <h1 class="cs-label">contact</h1>
                <p class="cs-statement">プロジェクトのご相談、<br>まずはお気軽にどうぞ。</p>
            </div>

            <div class="cs-bottom">
                <address class="cs-address">
                    <span class="cs-address__line">東京都渋谷区道玄坂一丁目１０番８号</span>
                    <span class="cs-address__line">渋谷道玄坂東急ビル２Ｆ－Ｃ</span>
                </address>
<div class="cs-foot-row">
                    <small class="cs-copy">&copy; 2026 nerdech. All rights reserved.</small>
                    <span class="cs-number" aria-hidden="true">05</span>
                </div>
            </div>

        </aside>

        <!-- ── 右パネル ── -->
        <div class="contact-split__right">
            <div class="cs-right__inner">

                <p class="cs-right__header">お問い合わせフォーム</p>

                <div id="form-sent" style="display:none; padding: 48px 0; text-align: center;">
                    <p style="font-family:'DM Mono',monospace; font-size:13px; letter-spacing:0.08em; color:rgba(255,255,255,0.6); line-height:2;">
                        お問い合わせありがとうございます。<br>
                        2〜3 営業日以内にご連絡いたします。
                    </p>
                </div>
                <div id="form-error" style="display:none; margin-bottom:16px; padding:12px 16px; border:1px solid rgba(239,68,68,0.4); border-radius:4px;">
                    <p style="font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.06em; color:#f87171;">
                        送信に失敗しました。入力内容をご確認ください。
                    </p>
                </div>
                <form id="contact-form" class="contact-form" action="contact_handler.php" method="post">
                    <div class="contact-form__row">
                        <label class="contact-form__label" for="contact-name">name</label>
                        <input class="contact-form__input" id="contact-name" type="text" name="name" placeholder="Your name" autocomplete="name" required>
                    </div>
                    <div class="contact-form__row">
                        <label class="contact-form__label" for="contact-email">mail</label>
                        <input class="contact-form__input" id="contact-email" type="email" name="email" placeholder="your@email.com" autocomplete="email" required>
                    </div>
                    <div class="contact-form__row contact-form__row--message">
                        <label class="contact-form__label" for="contact-message">message</label>
                        <textarea class="contact-form__input contact-form__textarea" id="contact-message" name="message" placeholder="Tell us about your project." rows="5" required></textarea>
                    </div>
                    <div class="contact-form__footer">
                        <button class="contact-form__submit" type="submit">send →</button>
                    </div>
                </form>

                <p class="cs-right__note">通常 2〜3 営業日以内にご返信いたします。</p>

            </div>
        </div>

    </div>

    <script src="Main.js"></script>
    <script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        if (params.get('sent') === '1') {
            document.getElementById('contact-form').style.display = 'none';
            document.getElementById('form-sent').style.display = 'block';
            document.querySelector('.cs-right__note').style.display = 'none';
        }
        if (params.get('error') === '1') {
            document.getElementById('form-error').style.display = 'block';
        }
    })();
    </script>
</body>
</html>
