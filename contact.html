<body class="contact-page">

<div class="cs-foot-row">

    <script src="Main.js"></script>
    <script>
    (function () {
        // ── 送信結果の表示 ──
        const params = new URLSearchParams(window.location.search);
        if (params.get('sent') === '1') {
            document.getElementById('contact-form').style.display = 'none';
            document.getElementById('form-sent').style.display = 'block';
            document.querySelector('.cs-right__note').style.display = 'none';
        }
        if (params.get('error') === '1') {
            document.getElementById('form-error').style.display = 'block';
        }

        // ── テキストを実測して font-size を自動調整 ──
        function fitStatement() {
            const el = document.querySelector('.cs-statement');
            const panel = document.querySelector('.contact-split__left');
            if (!el || !panel) return;

            // 左パネルの実際のテキスト幅を取得
            const panelStyle = getComputedStyle(panel);
            const availWidth = panel.clientWidth
                - parseFloat(panelStyle.paddingLeft)
                - parseFloat(panelStyle.paddingRight);

            // <br> で区切られた各行を測定するための隠し要素を作成
            const probe = document.createElement('span');
            probe.style.cssText = [
                'position:absolute',
                'white-space:nowrap',
                'visibility:hidden',
                'pointer-events:none',
                'font-family:' + getComputedStyle(el).fontFamily,
                'font-weight:' + getComputedStyle(el).fontWeight,
                'letter-spacing:' + getComputedStyle(el).letterSpacing,
            ].join(';');
            document.body.appendChild(probe);

            // <br> で分割して各行のテキストを取得
            const segments = el.innerHTML.split(/<br\s*\/?>/i).map(s => s.trim());

            // 二分探索で最適な font-size を求める
            let lo = 10, hi = 60;
            for (let i = 0; i < 24; i++) {
                const mid = (lo + hi) / 2;
                probe.style.fontSize = mid + 'px';

                // 最も幅が広い行を基準にする
                const maxW = segments.reduce((acc, seg) => {
                    probe.textContent = seg;
                    return Math.max(acc, probe.offsetWidth);
                }, 0);

                if (maxW > availWidth) hi = mid;
                else lo = mid;
            }

            document.body.removeChild(probe);

            // 安全マージン 4% を引いた値を適用
            el.style.fontSize = Math.floor(lo * 0.96) + 'px';
        }

        // フォント読み込み後に実行（フォントで幅が変わるため）
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitStatement);
        } else {
            window.addEventListener('load', fitStatement);
        }
        window.addEventListener('resize', fitStatement);
    })();
    </script>
